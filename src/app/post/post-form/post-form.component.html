<div>
    <h3>Post {{mode}}</h3>
    <ng-template #customTabButtons>
        <ul class="navbar-nav">
            <li class="nav-item"><button [disabled]="mode!='edit'" (click)="delete()" class="navbar-brand btn"><mat-icon
                        class="align-middle">delete</mat-icon></button></li>
        </ul>
    </ng-template>
    <div toolbar>
        <div></div>
    </div>
    <div>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="form-group row">
                <div class="col-xs-4 col-lg-4">
                    <label for="Nombre">Nombre</label>
                    <input type="text" class="form-control" formControlName="name" required>
                </div>
            </div>
            <div class="form-group row">
                <div class="col-xs-4 col-lg-4">
                    <label for="Title">Titulo</label>
                    <input type="text" class="form-control" formControlName="title" required>
                </div>
            </div>
            <div class="form-group row">
                <div class="col-xs-4 col-lg-8">
                    <label for="Nombre">Contenido</label>
                    <input type="text" class="form-control" formControlName="content" required>
                </div>
            </div>
            <div class="form-group row">
                <div class="col-md-2">
                    <label for="Estado">Estado</label>
                    <select class="form-control" formControlName="status">
                        <option *ngFor="let item of statusPost" [ngValue]="item">{{item}} </option>
                    </select>
                </div>
            </div>
            <div>
                 <button type="submit" class="btn btn-primary" [disabled]="!form.valid">Aceptar</button>
                 <button class="btn btn-primary ms-1" (click)="goBack()">Cancelar</button>                
            </div>
        </form>
    </div>
</div>
